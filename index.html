    window.addEventListener('DOMContentLoaded', () => {

      data.forEach((person, index) => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${index + 1}</td>
          <td>${person.name}</td>
          <td id="gender-${index}">•••••••</td>
          <td>

              Show Gender
            </button>
          </td>
        `;

        table.appendChild(row);
      });
    });

    function toggleGender(index, gender) {
      const genderCell = document.getElementById(`gender-${index}`);
      const button = document.getElementById(`btn-${index}`);

      if (genderCell.textContent === '•••••••') {
        genderCell.textContent = gender;
        button.textContent = 'Hide Gender';
      } else {
        genderCell.textContent = '•••••••';
        button.textContent = 'Show Gender';
      }
